// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
// The Android project is committed so CI can run deterministic checks, but
// Cargo's registry lives at a different absolute path on every machine.
// Resolve plugin sources from the active Cargo home instead of embedding the
// path of the workstation that last ran `tauri android init`.
def cargoHome = System.getenv('CARGO_HOME') ?: new File(System.getProperty('user.home'), '.cargo').absolutePath
def registryRoots = new File(cargoHome, 'registry/src').listFiles()?.toList() ?: []
def registryCrates = registryRoots.collectMany { root -> root.listFiles()?.toList() ?: [] }
def crateDir = { String prefix ->
    def match = registryCrates.find { it.name.startsWith(prefix) }
    if (match == null) throw new GradleException("Cargo registry crate not found: ${prefix} under ${cargoHome}")
    match
}
include ':tauri-android'
project(':tauri-android').projectDir = new File(crateDir('tauri-2.12.0'), 'mobile/android')
include ':tauri-plugin-opener'
project(':tauri-plugin-opener').projectDir = new File(crateDir('tauri-plugin-opener-2.6.0'), 'android')
