# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 关闭配置缓存：so-fix.gradle.kts 需要在任务里读写工程文件，
# 且配置缓存与本工程的非 ASCII 路径叠加会引入额外不确定性。
org.gradle.configuration-cache=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false

# 工程位于含中文字符的路径（D:\Mine\旅游项目）。
# AGP 会因非 ASCII 路径直接抛 BuildException，此处显式关闭该校验。
# 已知风险：Windows 下部分构建工具对非 ASCII 输出路径支持不佳，
# 若后续出现 D8/AAPT2 类失败，需将工程迁移至纯 ASCII 路径。
android.overridePathCheck=true

# Kotlin 编译器默认通过 daemon + 参数文件传参。参数文件经 Properties 序列化时会把
# 非 ASCII 路径转义为 \uXXXX，读回时反斜杠被当作路径分隔符消费掉，导致
# "source file or directory not found: C:\Users\u738Bu9526u6960\.cargo\..."。
# 改为 in-process 后不再落盘参数文件，直接规避。
kotlin.compiler.execution.strategy=in-process

# ---- Windows 构建必需（2026-09-29 实测结论，请勿删除）----
# 症状：Gradle 9.6.1 在 Windows 上并行执行 artifact transform 时，多个线程争用
# caches/<ver>/transforms/.internal/locks/<md5>.lock。Windows 下被争用的锁文件会进入
# "删除挂起"状态，后续 open 直接返回 ERROR_ACCESS_DENIED，表现为
#   java.io.FileNotFoundException: ...\.lock (拒绝访问。)
# 并伴随 transforms 缓存被写坏：
#   Could not deserialize analysis from a file: ...instrumentation-hierarchy.bin
# 已排除：磁盘空间（C 75G/D 79G 空闲）、Defender（实时防护本就关闭）、文件 ACL（完全控制）、
#        沙箱（关沙箱后依旧复现）、残留守护进程（已 --stop 且 taskkill）。
# 唯一有效对策：无守护进程 + 单 worker，从根上消除该竞态。
# 实测：`gradlew --no-daemon --max-workers=1 help` → BUILD SUCCESSFUL；去掉任一参数必失败。
org.gradle.daemon=false
org.gradle.workers.max=1
